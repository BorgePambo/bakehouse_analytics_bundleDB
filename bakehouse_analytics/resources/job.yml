resources:
  jobs:

    bakehouse_ingestion:
      name: "Bakehouse - Ingestion Bronze"

      tasks:
        - task_key: ingestion_bronze

          spark_python_task:
            python_file: ../src/notebooks/ingestion_bronze.py

            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"

          environment_key: serverless

      environments:
        - environment_key: serverless
          spec:
            client: "4"


    bakehouse_medallion_job:
      name: "Bakehouse Medallion Job"

      tasks:
        - task_key: run_medallion_pipeline

          pipeline_task:
            pipeline_id: ${resources.pipelines.bakehouse_medallion.id}