# This is a Declarative Automation Bundle definition for bakehouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse_analytics
  uuid: 90f177cb-fd10-4076-8b0b-38cc904e43a1

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    
    default: true
    workspace:
      host: https://dbc-f487d229-146e.cloud.databricks.com
    variables:
      catalog: bakehouse_dev
      schema: bronze


  prod:
    mode: production
    presets:
      name_prefix: prod_
    workspace:
      host: https://dbc-f487d229-146e.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/ambrosiopambo23@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ambrosiopambo23@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_prod
      schema: bronze
    permissions:
      - user_name: ambrosiopambo23@gmail.com
        level: CAN_MANAGE
        
